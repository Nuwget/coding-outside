[package]
name = "coding-outside-hub"
version = "0.0.1"
description = "Coding Outside Hub — Tauri 2 desktop app"
edition = "2021"
rust-version = "1.78"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21" }
tungstenite = "0.21"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
fastrand = "2"
dirs = "5"

[build-dependencies]

[profile.release]
opt-level = 3
